# ==============================================================================
#  FineNav-Engine Getting Started — Simulation Configuration
# ==============================================================================

hello_finenav:
  ros__parameters:
    use_sim_time: true

  # ── Navigator (BT engine) ─────────────────────────────────────────────────
  finenav_navigator:
    ros__parameters:
      # Additional BT path for the getting-started example.
      # (Built-in trees are always loaded — no need to list them here.)
      behavior_trees:
        - "finenav_example/getting_started/behavior_trees"

  # ── Localizer ─────────────────────────────────────────────────────────────
  finenav_localizer:
    ros__parameters:

      # 绝对位姿通道 PoseWithCovarianceStamped（本例不使用）
      pose_topic: ""                    # 空 = 禁用
      pose_smoothing_time: 0.0          # 0.0 = 收到即跳到目标
      initial_pose_topic: "/initialpose"  # 一次性初始位姿话题

      # 速度通道 TwistWithCovarianceStamped（本例不使用）
      twist_topic: ""

      # ── 里程计通道（仿真 ground truth）─────────────────────────────────────
      #   odom.pose 做帧间差分(RelPose)积分；odom.twist 是否设速度由 odom_use_twist 决定。
      odom_topic: "/odom"
      odom_use_twist: true              # /odom 自带速度

      # ── 状态历史窗口 ──────────────────────────────────────────────────────
      #   pose 与 map 侧观测都按"测量时刻"回填状态；超出窗口就取不到 ——
      #   pose 退化为用最新里程计算 anchor，观测消息直接丢弃。
      #   取值须覆盖最慢回填源的周期 + 解算/传输延迟（0.5 Hz 的 pose
      #   一个周期就是 2 s）；0 = 只保留最新一条。
      state_history_duration: 5.0

      # ── 输出 ──────────────────────────────────────────────────────────────
      force_2d_mode: true               # z/roll/pitch 输出前清零
      publish_tf: false                 # 广播 map→base_link（本示例不需要）
      publish_odom: true                # 在 ~/nav_state 发布 nav_msgs/Odometry


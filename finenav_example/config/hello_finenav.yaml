# ==============================================================================
#  FineNav-Engine Getting Started - Simulation Configuration
# ==============================================================================

/hello_finenav:
  ros__parameters:
    use_sim_time: true

/hello_finenav/finenav_navigator:
  ros__parameters:
    behavior_trees:
      - "finenav_example/getting_started/behavior_trees"

/hello_finenav/finenav_localizer:
  ros__parameters:
    pose_topic: ""
    pose_smoothing_time: 0.0
    initial_pose_topic: "/initialpose"
    twist_topic: ""

    odom_topic: "/odom"
    odom_use_twist: true

    state_history_duration: 5.0

    force_2d_mode: true
    publish_tf: false
    publish_odom: true

/hello_finenav/dummy_map:
  ros__parameters:
    dummy_map:
      window_size: 50.0

/hello_finenav/line_layer:
  ros__parameters:
    dummy_line_planner:
      path_resolution: 0.2

/hello_finenav/follow_layer:
  ros__parameters:
    dummy_follow_planner:
      linear_speed: 0.5
      angular_speed: 1.0
      lookahead_distance: 1.0

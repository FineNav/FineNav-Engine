# astar.yaml - AstarPathSearch 参数定义
astar_planner:
  # ── 栅格离散化参数 ──────────────────────────────────────────
  # 由规划器本身持有，IMapView 的实现者无需关心这些参数。
  # 每个格子对应的世界空间尺寸（单位：米）
  resolution:
    type: double
    default_value: 0.05
    description: "Grid cell size in metres"
    validation:
      bounds<>: [0.001, 10.0]
  # 栅格原点在世界坐标系下的坐标（通常与地图原点一致）
  origin_x:
    type: double
    default_value: 0.0
    description: "World x-coordinate of grid origin (cell 0,0,0)"
  origin_y:
    type: double
    default_value: 0.0
    description: "World y-coordinate of grid origin"
  origin_z:
    type: double
    default_value: 0.0
    description: "World z-coordinate of grid origin (only used in 3D mode)"
  # ── 搜索空间维度 ───────────────────────────────────────────
  dimension:
    type: string
    default_value: "2D"
    description: "Search dimension: 2D (xy-plane) or 3D (xyz-space)"
    validation:
      one_of<>: [[ "2D", "3D" ]]
  # ── 启发函数 ───────────────────────────────────────────────
  heuristic:
    type: string
    default_value: "Euclidean"
    description: "Heuristic: Euclidean | Manhattan | Chebyshev"
    validation:
      one_of<>: [[ "Euclidean", "Manhattan", "Chebyshev" ]]
  # ── 邻居规则 ───────────────────────────────────────────────
  # 是否允许对角方向移动（2D: 8方向; 3D: 26方向）
  allow_diagonal:
    type: bool
    default_value: true
  # 对角方向的步进代价（理论值 sqrt(2) ≈ 1.414）
  diagonal_weight:
    type: double
    default_value: 1.414
  # ── 目标容差 ───────────────────────────────────────────────
  goal_tolerance:
    type: double
    default_value: 0.25
    description: "Accept a path if the closest reached cell is within this many cells of the goal"
  # ── 未知区域处理 ───────────────────────────────────────────
  allow_unknown:
    type: bool
    default_value: true
    description: "Allow traversal of cells whose IMapView::isUnknown() returns true"
  # ── 搜索终止条件 ───────────────────────────────────────────
  max_iterations:
    type: int
    default_value: 1000000
  max_planning_time:
    type: double
    default_value: 5.0
    description: "Maximum planning time in seconds"

# astar.yaml - A* 参数定义
astar_planner:

  # 运行时选择 2D 或 3D 算法
  dimension:
    type: string
    default_value: "2D"
    description: "Algorithm dimension: 2D or 3D"
    validation:
      one_of<>: [[ "2D", "3D" ]]

  # 选择计算时的距离：欧几里德距离、曼哈顿距离、切比雪夫距离
  heuristic:
    type: string
    default_value: "Euclidean"
    validation:
      one_of<>: [[ "Euclidean", "Manhattan", "Chebyshev" ]]

  # 是否允许八方面行走
  allow_diagonal:
    type: bool
    default_value: true

  # 对角线代价
  diagonal_weight:
    type: double
    default_value: 1.414

  # 终点容差，不要求完全到 goal，距离 goal 小于某个阈值即可
  goal_tolerance:
    type: double
    default_value: 0.25

  # 是否允许往未知点前进
  allow_unknown:
    type: bool
    default_value: true

  # 最大搜索次数
  max_iterations:
    type: int
    default_value: 1000000

  # 最大规划时间，单位秒
  max_planning_time:
    type: double
    default_value: 5.0

  # 进入“tolerance”范围后继续搜索的最大迭代次数
  max_on_approach_iterations:
    type: int
    default_value: 1000



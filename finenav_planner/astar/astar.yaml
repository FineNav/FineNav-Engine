# astar.yaml - AstarPathSearch 参数定义
#
# 注意：栅格步长（step size）不在这里定义。
# 它是地图的属性，由 IMapView::getStepSize() 在规划时提供。
# 这确保整个导航系统只有一个步长来源。
astar_planner:
  # ── 搜索空间维度 ───────────────────────────────────────────
  dimension:
    type: string
    default_value: "2D"
    description: "Search dimension: 2D (xy-plane) or 3D (xyz-space)"
    validation:
      one_of<>: [[ "2D", "3D" ]]
  # ── 启发函数 ───────────────────────────────────────────────
  heuristic:
    type: string
    default_value: "Euclidean"
    description: "Heuristic function: Euclidean | Manhattan | Chebyshev"
    validation:
      one_of<>: [[ "Euclidean", "Manhattan", "Chebyshev" ]]
  # ── 邻居规则 ───────────────────────────────────────────────
  allow_diagonal:
    type: bool
    default_value: true
    description: "Allow diagonal moves (2D: 8-connected; 3D: 26-connected)"
  diagonal_weight:
    type: double
    default_value: 1.414
    description: "Cost of a diagonal step relative to a straight step (theoretical sqrt(2))"
  # ── 目标容差（单位：米）────────────────────────────────────
  #
  # 如果 A* 无法精确到达终点格子，允许在此范围内的最近点作为终点。
  # 内部自动换算为格子数：goal_tolerance / getStepSize()
  goal_tolerance:
    type: double
    default_value: 0.5
    description: "Acceptable distance to goal in metres"
  # ── 未知区域处理 ───────────────────────────────────────────
  allow_unknown:
    type: bool
    default_value: true
    description: "Allow traversal of cells whose IMapView::isUnknown() returns true"
  # ── 搜索终止条件 ───────────────────────────────────────────
  max_iterations:
    type: int
    default_value: 1000000
    description: "Maximum number of nodes expanded before giving up (-1 = unlimited)"
  max_planning_time:
    type: double
    default_value: 5.0
    description: "Maximum planning wall-clock time in seconds"

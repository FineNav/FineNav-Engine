# bfs.yaml - BfsPathSearch 参数定义
#
# 栅格步长由 IMapView::getStepSize() 在规划时提供。

bfs_planner:
  # ── 邻居连通性 ─────────────────────────────────────────────
  #
  #   "4"  — 2-D,  4-连通（仅正交）
  #   "8"  — 2-D,  8-连通（正交 + 对角）
  #   "6"  — 3-D,  6-连通（仅面邻居）
  #   "18" — 3-D, 18-连通（面 + 棱对角）
  #   "26" — 3-D, 26-连通（面 + 棱 + 顶角）
  connectivity:
    type: string
    default_value: "8"
    description: "Grid connectivity: 4/8 for 2-D, 6/18/26 for 3-D"
    validation:
      one_of<>: [[ "4", "8", "6", "18", "26" ]]

  # ── 目标容差（单位：米）────────────────────────────────────
  #
  # 如果 BFS 无法精确到达终点格子，允许在此范围内的最近点作为终点。
  goal_tolerance:
    type: double
    default_value: 0.5
    description: "Acceptable distance to goal in metres"

  # ── 搜索终止条件 ───────────────────────────────────────────
  max_iterations:
    type: int
    default_value: 1000000
    description: "Maximum number of nodes expanded before giving up (-1 = unlimited)"

  max_planning_time:
    type: double
    default_value: 5.0
    description: "Maximum planning wall-clock time in seconds"

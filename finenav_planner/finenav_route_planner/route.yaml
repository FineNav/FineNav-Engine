# route.yaml - RoutePathSearch 参数定义
route_planner:
  path_density:
    type: double
    default_value: 0.05
    description: "Interpolation step (m) for densifying the route output path"
  min_approach_angle_deg:
    type: double
    default_value: 0.0
    description: "Minimum angle (degrees) between approach direction and path tangent for path-point snapping. Candidates with smaller angles are rejected to avoid perpendicular connector paths. For a smooth merge, set to e.g. 120.0 (approach from behind the path direction). Set to 0.0 to disable."
  obstacle_cost_weight:
    type: double
    default_value: 1.0
    description: "Coefficient applied to the map obstacle cost in the snapping Dijkstra search (0 = ignore map cost, larger = keep further from obstacles). Edge cost = step * (1 + obstacle_cost_weight * cost). Rule of thumb: weight * max_traversable_cost ~= 2. Recommended: normalized 0-1 -> 1.3~3.5 (2.0 typical); OccupancyGrid 0-100 -> ~0.02; Nav2 costmap 0-252 -> ~0.008."

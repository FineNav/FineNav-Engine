# route.yaml - RoutePathSearch 参数定义
route_planner:
  path_density:
    type: double
    default_value: 0.05
    description: "Interpolation step (m) for densifying the route output path"
  obstacle_cost_weight:
    type: double
    default_value: 1.0
    description: "Coefficient applied to the map obstacle cost in the snapping Dijkstra search (0 = ignore map cost, larger = keep further from obstacles)"
  include_connectors:
    type: bool
    default_value: true
    description: "When true, prepend/append the obstacle-aware connector paths (robot pose → route entry, route exit → goal pose) to the output. Set to false in pipelines where a downstream DetourPlanner re-anchors the robot to the reference every cycle — a connector baked into a single-shot plan goes stale and misleads the re-anchoring. NOTE: with false, nothing plans the final leg to a goal that is off the route network; the goal is assumed to lie on it."

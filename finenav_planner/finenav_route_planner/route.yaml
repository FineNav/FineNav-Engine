# route.yaml - RoutePathSearch 参数定义
route_planner:
  connector_density:
    type: double
    default_value: 0.05
    description: "Grid cell size (m) used in the BFS nearest-node search"
  path_density:
    type: double
    default_value: 0.05
    description: "Interpolation step (m) for densifying the route output path"

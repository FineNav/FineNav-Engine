# route.yaml - RoutePathSearch 参数定义
route_planner:
  path_density:
    type: double
    default_value: 0.05
    description: "Interpolation step (m) for densifying the route output path"
  min_approach_angle_deg:
    type: double
    default_value: 0.0
    description: "Minimum angle (degrees) between approach direction and path tangent for path-point snapping. Candidates with smaller angles are rejected to avoid perpendicular connector paths. For a smooth merge, set to e.g. 120.0 (approach from behind the path direction). Set to 0.0 to disable."
  terrain_weight:
    type: double
    default_value: 1.0
    description: "Multiplier for map terrain cost in the snapping Dijkstra search. Increase to keep connector paths further from high-cost areas. Rule of thumb: terrain_weight * max_traversable_cost ~= 2. Recommended: normalized cost 0-1 -> 1.3~3.5 (2.0 typical); OccupancyGrid 0-100 -> ~0.02; Nav2 costmap 0-252 -> ~0.008."
  snap_connectivity:
    type: string
    default_value: "8"
    description: "Connectivity for the snapping Dijkstra search that connects robot/goal poses to the route graph. Options: 4, 8. Higher connectivity finds paths through diagonals but may clip obstacle corners."
  snap_max_iterations:
    type: int
    default_value: -1
    description: "Maximum iterations for the snapping Dijkstra search. -1 means no limit. Reduce if snap search is too slow on very large maps."
  snap_max_planning_time:
    type: double
    default_value: 5.0
    description: "Maximum planning time (seconds) for the snapping Dijkstra search. If exceeded, the snap fails and plan() returns nullopt."

# route.yaml - RoutePathSearch 参数定义
route_planner:
  max_iterations:
    type: int
    default_value: 0
    description: "Maximum Dijkstra iterations (0 = unlimited)"
  distance_weight:
    type: double
    default_value: 1.0
    description: "Weight applied to edge Euclidean distance cost"
  connector_density:
    type: double
    default_value: 0.05
    description: "Grid cell size (m) used in BFS nearest-node search"
  path_density:
    type: double
    default_value: 0.05
    description: "Interpolation density (m) when densifying route edges"


# bfs.yaml - BfsPathSearch 参数定义
#
# 栅格步长由 IMapView::getStepSize() 在规划时提供。
bfs_planner:
  connectivity:
    type: string
    default_value: "8"
    description: "Grid connectivity: 4/8 for 2-D, 6/18/26 for 3-D"
    validation:
      one_of<>: [[ "4", "8", "6", "18", "26" ]]
  goal_tolerance:
    type: double
    default_value: 0.5
    description: "Acceptable distance to goal in metres"
  max_iterations:
    type: int
    default_value: 1000000
    description: "Maximum number of nodes expanded before giving up (-1 = unlimited)"
  max_planning_time:
    type: double
    default_value: 5.0
    description: "Maximum planning wall-clock time in seconds"
  movement_weight:
    type: double
    default_value: 1.0
    description: "Multiplier on step cost before adding map cost. Scales movement distance vs obstacle penalty."
  obstacle_cost_weight:
    type: double
    default_value: 1.0
    description: "Coefficient applied to the map obstacle cost (0 = ignore map cost, larger = keep further from obstacles). Edge cost = step * (movement_weight + obstacle_cost_weight * cost). Rule of thumb: weight * max_traversable_cost ~= 2 * movement_weight. Recommended: normalized 0-1 -> 1.3~3.5 (2.0 typical); OccupancyGrid 0-100 -> ~0.02; Nav2 costmap 0-252 -> ~0.008. Lethal cells (e.g. Nav2 253-255) must be blocked via IMapView::isWalkable(), not by raising this weight."


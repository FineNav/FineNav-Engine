grid_map:
  resolution:
    type: double
    default_value: 0.05
    description: "Grid resolution, metres per cell"
    validation:
      gt<>: [0.0]
  length:
    x:
      type: double
      default_value: 10.0
      description: "Rolling window size along X, metres"
      validation:
        gt<>: [0.0]
    y:
      type: double
      default_value: 10.0
      description: "Rolling window size along Y, metres"
      validation:
        gt<>: [0.0]
    z:
      type: double
      default_value: 1.0
      description: "Rolling window size along Z, metres"
      validation:
        gt<>: [0.0]
  background:
    r:
      type: int
      default_value: 0
      description: "Red color value for the background, 8-bit"
      validation:
        bounds<>: [0, 255]
    g:
      type: int
      default_value: 0
      description: "Green color value for the background, 8-bit"
      validation:
        bounds<>: [0, 255]
    b:
      type: int
      default_value: 0
      description: "Blue color value for the background, 8-bit"
      validation:
        bounds<>: [0, 255]